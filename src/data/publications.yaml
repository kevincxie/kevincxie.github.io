    year: 2026
    selected: true
    teaser: /assets/pubs/drivejudge.png
    links:
      paper: https://arxiv.org/abs/2606.17362
    tldr: "A context-aware AV evaluation framework combining rule-based metrics with VLM reasoning about when rules should apply, avoiding over-penalizing reasonable long-tail driving behavior."

